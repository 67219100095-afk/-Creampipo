<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>PRODUCT</title>

<style>
/* พื้นฐาน */
body{
    margin:0;
    font-family: Arial, sans-serif;
    background-color:#ffe4ec; /* ชมพูอ่อน */
}

/* แบนเนอร์ */
.header img{
    width:100%;
    height:auto;
}

/* เมนู */
.menu{
    background-color:#f8c8dc; /* ชมพูพาสเทล */
    padding:30px 10px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.menu a{
    text-decoration:none;
}

.menu img{
    width:120px;
    height:120px;
    background:#fff;
    padding:15px;
    border-radius:20px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    transition:0.3s;
}

.menu img:hover{
    transform:scale(1.1);
}

/* ส่วนติดตามสินค้า */
.track{
    background:#ffffff;
    width:400px;
    margin:40px auto;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,0.15);
}

.track h2{
    color:#d81b60;
}

.track input{
    width:80%;
    padding:10px;
    border-radius:10px;
    border:1px solid #ccc;
    margin-top:10px;
}

.track button{
    margin-top:15px;
    padding:10px 25px;
    background:#f48fb1;
    border:none;
    border-radius:20px;
    color:#fff;
    font-size:16px;
    cursor:pointer;
}

.track button:hover{
    background:#ec407a;
}

#result{
    margin-top:15px;
    color:#c2185b;
    font-weight:bold;
}
</style>

</head>

<body>
